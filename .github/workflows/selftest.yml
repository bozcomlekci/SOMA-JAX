# Install SOMA-JAX on Linux, macOS and Windows and run the portable self-test
# (tools/selftest). See docs/INSTALL.md §5.
#
# * install — every OS x the oldest / a middle / the newest supported Python,
#   the documented `pip install -e ".[dev,vis,usd]"`, asset-free subset. The
#   submodule is checked out WITHOUT its Git LFS data, as on a machine without
#   git-lfs, which is the path the asset code has to handle.
# * assets  — every OS: fetch the assets with tools/download_assets.py (standard
#   library only, run before anything is installed), then the full self-test.
# * lowest  — the dependency floors in pyproject.toml, resolved with
#   `uv --resolution lowest-direct`, full self-test.
name: selftest

on:
  push:
    paths-ignore: ["**.md", "assets/media/**", "benchmarks/figures/**", "benchmarks/results/**"]
  pull_request:
    paths-ignore: ["**.md", "assets/media/**", "benchmarks/figures/**", "benchmarks/results/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  install:
    name: install · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true               # top level only; LFS objects deliberately not fetched
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (documented command)
        run: python -m pip install -e ".[dev,vis,usd]"
      - name: Self-test (asset-free subset)
        run: python -m pytest tools/selftest -q -rs -m "not slow" -p no:cacheprovider

  assets:
    name: assets · ${{ matrix.os }} · py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: assets/third_party
          key: soma-assets-v2-${{ runner.os }}-${{ hashFiles('soma_jax/assets.py', 'tools/download_assets.py') }}
      # What from_upstream_assets() needs plus the Anny / GarmentMeasurements
      # packs the identity-backend tests use — not the 696 MB MHR model.
      - name: Fetch assets (stdlib only, before any install)
        run: >-
          python tools/download_assets.py --only SOMA_neutral.npz SOMA_template_rig.usda
          SOMA_procedural_transforms.json Anny/base_body.obj Anny/SOMA_wrap.obj
          GarmentMeasurements/mean.obj GarmentMeasurements/SOMA_wrap.obj
          GarmentMeasurements/point.npz
      - name: Headless OpenGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: Install
        run: python -m pip install -e ".[dev,vis,usd]"
      - name: Self-test (full)
        run: python -m pytest tools/selftest -q -rs -p no:cacheprovider --durations=10

  lowest:
    name: lowest supported versions · ubuntu · py3.10
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: assets/third_party
          key: soma-assets-v2-${{ runner.os }}-${{ hashFiles('soma_jax/assets.py', 'tools/download_assets.py') }}
      - name: Fetch assets
        run: >-
          python tools/download_assets.py --only SOMA_neutral.npz SOMA_template_rig.usda
          SOMA_procedural_transforms.json Anny/base_body.obj Anny/SOMA_wrap.obj
          GarmentMeasurements/mean.obj GarmentMeasurements/SOMA_wrap.obj
          GarmentMeasurements/point.npz
      - name: Install the dependency floors
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev,vis,usd]"
          python -c "import jax, numpy, scipy, equinox, optax; print('jax', jax.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'equinox', equinox.__version__, 'optax', optax.__version__)"
      - name: Self-test (full)
        run: python -m pytest tools/selftest -q -rs -p no:cacheprovider
